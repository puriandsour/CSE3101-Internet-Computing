<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <section id="section-header" class="header-section">
        <div class="container">
            <header class="site-header">
                <!-- Logo Area -->
                <div class="logo-group">
                    <div class="logo-icon-wrapper">
                        <!-- merged image -->
                        <div class="merged-icon">
                            <img src="${ASSET_PATH}/29_5460.svg" alt="Logo Part 1" class="icon-layer" />
                            <img src="${ASSET_PATH}/29_5461.svg" alt="Logo Part 2" class="icon-layer" />
                        </div>
                    </div>
                    <div class="logo-text">EduTrack</div>
                </div>

                <!-- Right Actions -->
                <div class="header-actions">
                    <div class="notification-btn">
                        <img src="${ASSET_PATH}/29_5470.svg" alt="Notifications" />
                    </div>
                    <div class="user-profile">
                        <img src="${ASSET_PATH}/b46401def05f0fc39327442da1c34c908d2bdc7c.png" alt="User Profile" />
                    </div>
                </div>
            </header>
        </div>
    </section>

    <section id="section-main" class="main-section">
        <div class="container main-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-content">
                    <!-- Navigation -->
                    <nav class="sidebar-nav">
                        <div class="nav-group">
                            <div class="nav-header">EduTrack</div>

                            <a href="#" class="nav-item">
                                <div class="nav-icon">
                                    <img src="${ASSET_PATH}/29_5483.svg" alt="Dashboard" />
                                </div>
                                <span>Dashboard</span>
                            </a>

                            <a href="#" class="nav-item">
                                <div class="nav-icon">
                                    <img src="${ASSET_PATH}/29_5490.svg" alt="Students" />
                                </div>
                                <span>Students</span>
                            </a>

                            <a href="#" class="nav-item">
                                <div class="nav-icon">
                                    <img src="${ASSET_PATH}/29_5497.svg" alt="Teachers" />
                                </div>
                                <span>Teachers</span>
                            </a>

                            <a href="#" class="nav-item active">
                                <div class="nav-icon">
                                    <img src="${ASSET_PATH}/29_5504.svg" alt="Classes" />
                                </div>
                                <span>Classes</span>
                            </a>

                            <a href="#" class="nav-item">
                                <div class="nav-icon">
                                    <img src="${ASSET_PATH}/29_5511.svg" alt="Subjects" />
                                </div>
                                <span>Subjects</span>
                            </a>

                            <a href="#" class="nav-item">
                                <div class="nav-icon">
                                    <img src="${ASSET_PATH}/29_5518.svg" alt="Settings" />
                                </div>
                                <span>Settings</span>
                            </a>
                        </div>

                        <!-- Bottom Actions -->
                        <div class="sidebar-bottom">
                            <button class="btn-new">
                                <span>New</span>
                            </button>

                            <a href="#" class="nav-item help-item">
                                <div class="nav-icon">
                                    <img src="${ASSET_PATH}/29_5530.svg" alt="Help" />
                                </div>
                                <span>Help and Docs</span>
                            </a>
                        </div>
                    </nav>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="content-area">
                <div class="content-wrapper">
                    <h1 class="page-title">Create New Class</h1>

                    <form class="class-form">
                        <!-- Grade Select -->
                        <div class="form-group">
                            <label class="form-label">Grade</label>
                            <div class="custom-select">
                                <span class="placeholder">Select Grade</span>
                                <img src="${ASSET_PATH}/29_5740.svg" alt="Expand" class="chevron" />
                            </div>
                        </div>

                        <!-- Class Name Input -->
                        <div class="form-group">
                            <label class="form-label">Class Name</label>
                            <div class="custom-input">
                                <input type="text" placeholder="Enter Class Name" class="text-input" />
                            </div>
                        </div>

                        <!-- Room Number Input -->
                        <div class="form-group">
                            <label class="form-label">Room Number</label>
                            <div class="custom-input">
                                <input type="text" placeholder="Enter Room Number" class="text-input" />
                            </div>
                        </div>

                        <!-- Helper Text -->
                        <div class="form-helper">
                            <p>Maximum 6 classes per grade allowed</p>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <button type="submit" class="btn-save">Save</button>
                            <button type="button" class="btn-cancel">Cancel</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </section>
</body>

</html>
